<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="4in" height="2.5in" viewBox="0 0 400 250">
  <title>Cut, score, and engrave classroom sample tile</title>
  <desc>Teacher sample file with a red cut outline, blue scored details, and black engraved fills.</desc>
  <!-- RED STROKES: assign CUT in the laser software. -->
  <g id="CUT" fill="none" stroke="#ff0000" stroke-width="1">
    <rect x="8" y="8" width="384" height="234" rx="18"/>
    <circle cx="48" cy="48" r="13"/>
  </g>

  <!-- BLUE STROKES: assign SCORE in the laser software. -->
  <g id="SCORE" fill="none" stroke="#0000ff" stroke-width="1">
    <path d="M32 104 H368"/>
    <path d="M32 176 H368"/>
    <path d="M110 104 V224 M208 104 V224 M306 104 V224"/>
    <path d="M132 78 L174 36 L216 78 L258 36 L300 78"/>
  </g>

  <!-- BLACK FILLS: assign ENGRAVE in the laser software. -->
  <g id="ENGRAVE" fill="#000000" stroke="none">
    <circle cx="84" cy="140" r="22"/>
    <rect x="154" y="120" width="44" height="40" rx="8"/>
    <path d="M258 160 L278 120 L298 160 Z"/>
    <path d="M330 122 h28 v8 h-28z M330 137 h22 v8 h-22z M330 152 h28 v8 h-28z"/>
    <path d="M58 205 h52 v7 h-52z M142 202 h65 v7 h-65z M240 199 h70 v7 h-70z"/>
  </g>
</svg>
